name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Reviewed pull request head commit SHA
        required: true

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    environment: bottle-publishing
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Verify reviewed pull request and successful checks
        id: verify_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          actual_sha=$(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          state=$(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [[ "$state" != "OPEN" && "$state" != "MERGED" ]]; then
            echo "Pull request must be open or merged." >&2
            exit 1
          fi
          if [[ "$actual_sha" != "$HEAD_SHA" ]]; then
            echo "Reviewed head SHA does not match the pull request." >&2
            exit 1
          fi
          gh pr checks "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_STATE: ${{ steps.verify_pr.outputs.state }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          args=(--debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA")
          if [[ "$PR_STATE" == "MERGED" ]]; then
            args+=(--no-cherry-pick)
          fi
          brew pr-pull "${args[@]}" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          branch: main
