name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: brew-test-bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  test-bot-macos:
    strategy:
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - name: Detect formula changes
        id: formula_changes
        if: github.event_name != 'push'
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.base_ref }}
        run: |
          tap_path=$(brew --repository "$GITHUB_REPOSITORY")
          git -C "$tap_path" fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git -C "$tap_path" diff --quiet "origin/$BASE_REF...HEAD" -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test changed formulae
        if: github.event_name != 'push' && steps.formula_changes.outputs.changed == 'true'
        env:
          GITHUB_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.base_ref }}
        run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: success() && github.event_name != 'push' && steps.formula_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"

  test-bot-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main@sha256:5e832b72937b0e867e6e802de1be35da68ae18de423c8a448077b54900ee92ac
      options: --privileged
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - name: Detect formula changes
        id: formula_changes
        if: github.event_name != 'push'
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.base_ref }}
        run: |
          tap_path=$(brew --repository "$GITHUB_REPOSITORY")
          git -C "$tap_path" fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git -C "$tap_path" diff --quiet "origin/$BASE_REF...HEAD" -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test changed formulae
        if: github.event_name != 'push' && steps.formula_changes.outputs.changed == 'true'
        env:
          GITHUB_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.base_ref }}
        run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: success() && github.event_name != 'push' && steps.formula_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bottles_ubuntu-latest
          path: "*.bottle.*"
